name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum

    - name: Get version from tag
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "Building version: ${VERSION}"
        
    - name: Get build time
      id: build_time
      run: |
        BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
        
    - name: Build for Linux and Windows
      run: |
        VERSION="${{ steps.version.outputs.version }}" \
        COMMIT="$(git rev-parse --short HEAD)" \
        BUILD_TIME="${{ steps.build_time.outputs.time }}" \
        ./build.sh

    # install.sh 从 Releases 下载固定文件名，这里额外产出这两个别名
    - name: Prepare release asset aliases
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cp dist/reality-checker-linux-amd64 dist/reality-checker-main
        cp dist/reality-checker-windows-amd64.exe dist/reality-checker-main.exe
        ls -lh dist
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          src/dist/*
        body: |
          ## RC ${{ steps.version.outputs.version }}

          RC 是 VPS 聚合运维面板：SSH 加固、连通体检与调优、REALITY 伪装目标筛选，集中在一个 `rc` 面板里。

          ### 本次更新

          - 下线内置 Web 控制台与 REST/SSE 服务：删除前端工程、HTTP 服务端与 `serve` 子命令
          - `daemon` 不再监听端口，`--port/--host/--token/--no-http` 退化为兼容旧参数的无效项，请从 `/etc/default/reasni` 中删除
          - 构建链只依赖 Go：移除 pnpm / Node 步骤与前端产物校验
          - 保留引擎侧 `get` / `auto` / `asn` / `check` / `batch` / `pipe` / `daemon` / `patrol` / `migrate` 能力
          - 修正面板与文档中对外呈现的项目口径

          ### 面板能力

          - **SSH 加固**：写入公钥与改端口、只改端口、关闭密码登录、配置回滚（改动前备份，`sshd -t` 校验，失败自动回滚）
          - **体检与调优**：TCP 质量检测（TcpQuality）、NQ 测试（NodeQuality）、TCP 调优（tcpfit）
          - **目标筛选**：自动探测出口 IP 并调用引擎扫描，输出带星级的 REALITY 伪装目标
          - **维护**：默认设置、面板自更新、执行日志、卸载

          ### 推荐工作流

          ```bash
          # 安装面板并进入交互菜单
          curl -LfsS https://raw.githubusercontent.com/G1oow/RC/main/rc.sh -o /usr/local/bin/rc
          chmod +x /usr/local/bin/rc && rc

          # 或直接跑单项
          rc ssh          # 写入公钥 + 改 SSH 端口 + 放行防火墙
          rc tcpq         # TCP 质量检测
          rc reality      # REALITY 伪装目标筛选
          ```

          ### 质量状态

          - 已通过 `go build ./...`
          - 已通过 `go test ./...`

          请从下方 Assets 下载对应平台的引擎产物；面板安装与配置说明见仓库根目录的 `README.md`。

          > 本工具仅用于技术研究和学习，请遵守当地法律法规并合理使用网络资源。
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts (for non-tag builds)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: reality-checker-builds
        path: src/dist/
