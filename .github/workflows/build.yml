name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum

    - name: Get version from tag
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "Building version: ${VERSION}"
        
    - name: Get build time
      id: build_time
      run: |
        BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
        
    # 发版前必须把 rc.sh 的 RC_VERSION 提到本次 tag 版本：
    # 面板横幅与 rc update 都读这个字符串，落后就会显示旧版本、且自更新判定为「已是最新」
    - name: Verify panel version matches tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail
        TAG_VER="${GITHUB_REF_NAME#v}"
        PANEL_VER="$(sed -n "s/^RC_VERSION=['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}$/\1/p" "${GITHUB_WORKSPACE}/rc.sh" 2>/dev/null | head -n1 || true)"
        if [ -z "${PANEL_VER}" ]; then
          echo "::error::rc.sh 里读不到 RC_VERSION"
          exit 1
        fi
        if [ "${PANEL_VER}" != "${TAG_VER}" ]; then
          echo "::error::rc.sh RC_VERSION=${PANEL_VER} 与 tag ${GITHUB_REF_NAME} 不一致：先把 RC_VERSION 改成 ${TAG_VER} 再打 tag"
          exit 1
        fi
        echo "RC_VERSION=${PANEL_VER} 与 tag ${GITHUB_REF_NAME} 一致"
    - name: Build for Linux and Windows
      run: |
        VERSION="${{ steps.version.outputs.version }}" \
        COMMIT="$(git rev-parse --short HEAD)" \
        BUILD_TIME="${{ steps.build_time.outputs.time }}" \
        ./build.sh

    # install.sh 从 Releases 下载固定文件名，这里额外产出这两个别名
    - name: Prepare release asset aliases
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cp dist/reality-checker-linux-amd64 dist/reality-checker-main
        cp dist/reality-checker-windows-amd64.exe dist/reality-checker-main.exe
        ls -lh dist
    # 发布说明按「上一个 tag → 本次 tag」的提交自动生成，避免正文写死后与版本脱钩
    - name: Compose release notes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail
        TAG="${GITHUB_REF_NAME}"
        VER="${TAG#v}"
        PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
        PANEL_VER="$(sed -n "s/^RC_VERSION=['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}$/\1/p" "${GITHUB_WORKSPACE}/rc.sh" 2>/dev/null | head -n1 || true)"

        {
          printf '## RC %s\n\n' "${VER}"
          printf 'RC 是 VPS 聚合运维面板：SSH 加固、连通体检与调优、REALITY 伪装目标筛选，集中在一个 `rc` 面板里。\n\n'
          printf '### 本次更新\n\n'
          if [ -n "${PREV}" ]; then
            printf '相对 %s 的提交：\n\n' "${PREV}"
            git log --no-merges --pretty='- %s (%h)' "${PREV}..${TAG}"
          else
            printf '此前的提交：\n\n'
            git log --no-merges --pretty='- %s (%h)' -n 20 "${TAG}"
          fi
          printf '\n### 版本\n\n'
          printf '* 发布版本：`%s`\n' "${TAG}"
          printf '* 面板版本：`%s`（`rc.sh` 的 `RC_VERSION`）\n\n' "${PANEL_VER:--}"
          printf '### 安装\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/G1oow/RC/main/rc.sh | bash\n```\n\n'
          printf '非 root 用 `| sudo bash`；只想安装不启动用 `| bash -s -- install-self`。\n\n'
          printf '### 质量状态\n\n'
          printf '* 已通过 `go build ./...`、`go vet ./...`、`go test ./...`\n\n'
          printf '> 本工具仅用于技术研究和学习，请遵守当地法律法规并合理使用网络资源。\n'
        } > "${GITHUB_WORKSPACE}/RELEASE_NOTES.md"

        cat "${GITHUB_WORKSPACE}/RELEASE_NOTES.md"
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          src/dist/*
        body_path: ${{ github.workspace }}/RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts (for non-tag builds)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: reality-checker-builds
        path: src/dist/
